<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jarvis Weather App</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Jarvis Weather App</h1>
    </header>
    <main>
        <section class="hud-container">
            <div class="hud-display">
                <h2 id="location"></h2>
                <p id="weather-description"></p>
                <p id="temperature"></p>
                <p id="humidity"></p>
                <p id="wind-speed"></p>
            </div>
            <div class="hud-controls">
                <button id="refresh-button">Actualizar</button>
            </div>
        </section>
    </main>
    <script src="script.js" type="text/javascript"></script>
</body>
</html>
